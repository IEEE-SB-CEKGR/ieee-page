name: Continuous Deployment (Prod)
on:
  push:
    branches: [ prod ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets."
            exit 1
          fi

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: aka717/ieee-page:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXT_PUBLIC_STACK_PROJECT_ID=${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }}
            NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Clone ieee-manifests repo, update, and push
        env:
          PAT: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          # Use the token for cloning too, not just for pushing
          git clone https://x-access-token:${PAT}@github.com/IEEE-SB-CEKGR/ieee-manifests.git
          cd "ieee-manifests"
          
          # Check if deployment.yml exists
          if [ ! -f "deployment.yml" ]; then
            echo "❌ ERROR: deployment.yml file not found!"
            echo "Available files in repository:"
            find . -type f -name "*.yml" -o -name "*.yaml"
            exit 1
          fi
          
          # Show current image before change
          echo "Current image setting:"
          grep -n "image:" deployment.yml
          
          # Update the image using a pattern that matches the actual image format
          sed -i 's|image: ghcr.io/.*/ieee-page:.*|image: aka717/ieee-page:${{ github.sha }}|' deployment.yml
          
          # Verify the change was successful
          if grep -q "image: aka717/ieee-page:${{ github.sha }}" deployment.yml; then
            echo "✅ Successfully updated image tag to: ${{ github.sha }}"
            echo "New image line:"
            grep -n "image:" deployment.yml
          else
            echo "❌ First pattern failed, trying alternative pattern..."
            # Try a more generic pattern
            sed -i 's|image:.*ieee-page:.*|image: aka717/ieee-page:${{ github.sha }}|' deployment.yml
            
            # Check again
            if grep -q "image: aka717/ieee-page:${{ github.sha }}" deployment.yml; then
              echo "✅ Successfully updated image with alternative pattern"
            else
              echo "❌ Image tag update failed. Current content:"
              cat deployment.yml
              exit 1
            fi
          fi
          
          # Configure Git and push changes
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yml
          git diff --staged --quiet || git commit -m "Update ieee-page image to ${{ github.sha }}"
          git push https://x-access-token:${PAT}@github.com/IEEE-SB-CEKGR/ieee-manifests.git master
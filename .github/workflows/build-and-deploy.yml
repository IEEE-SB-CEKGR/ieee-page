name: Continuous Deployment (Prod)
on:
  push:
    branches: [ prod ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: aka717/ieee-page:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }} 

      - name: Clone ieee-manifests repo, update, and push
        env:
          PAT: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          # Use the token for cloning too, not just for pushing
          git clone https://x-access-token:${PAT}@github.com/IEEE-SB-CE-KGR/ieee-manifests.git
          cd "ieee-manifests"
          
          # Check if deployment.yml exists
          if [ ! -f "deployment.yml" ]; then
            echo "❌ ERROR: deployment.yml file not found!"
            echo "Available files in repository:"
            find . -type f -name "*.yml" -o -name "*.yaml"
            exit 1
          fi
          
          # Show current image before change
          echo "Current image setting:"
          grep -n "image: aka717/ieee-page" deployment.yml || echo "No matching image line found!"
          
          # Update the image using a more robust pattern
          sed -i 's|image: aka717/ieee-page:.*|image: aka717/ieee-page:${{ github.sha }}|' deployment.yml
          
          # Verify the change was successful
          if grep -q "image: aka717/ieee-page:${{ github.sha }}" deployment.yml; then
            echo "✅ Successfully updated image tag to: ${{ github.sha }}"
          else
            echo "❌ Image tag update failed. Current content:"
            cat deployment.yml
            exit 1
          fi
          
          # Configure Git and push changes
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yml
          git diff --staged --quiet || git commit -m "Update ieee-page image to ${{ github.sha }}"
          git push https://x-access-token:${PAT}@github.com/IEEE-SB-CE-KGR/ieee-manifests.git master
name: Continuous Deployment (Prod)
on:
  push:
    branches: [ prod ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: aka717/ieee-page:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }} 

      - name: Clone ieee-manifests repo, update, and push
        env:
          PAT: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          git clone https://github.com/IEEE-SB-CE-KGR/ieee-manifests.git
          cd "ieee-manifests"
          sed -i 's|image: aka717/ieee-page:.*|image: aka717/ieee-page:${{ github.sha }}|' deployment.yml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yml
          git commit -m "Update ieee-page image to ${{ github.sha }}"
          git push https://${PAT}@github.com/code100x/staging-ops.git main
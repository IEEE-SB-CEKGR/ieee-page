name: Build and Update Manifests

on:
  push:
    branches: [prod]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: aka717/ieee-page
  # Add manifest repository information
  MANIFEST_REPO: "IEEE-SB-CE-KGR/ieee-manifests"
  MANIFEST_BRANCH: "master"
  MANIFEST_PATH: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'prod') }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_IMG_URL=${{ secrets.NEXT_PUBLIC_IMG_URL || 'http://localhost:3001' }}
      
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      # Only update manifests on push to main, not on PR
      - name: Checkout manifest repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v3
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: ${{ env.MANIFEST_BRANCH }}
          path: manifests
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
      
      - name: Update Kubernetes manifests in external repository
        if: github.event_name != 'pull_request'
        run: |
          echo "Updating manifest repo with new image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}"
          
          # Go to the manifest repository directory
          cd manifests/${{ env.MANIFEST_PATH }}
          
          # Update the image in the deployment file
          if [ -f "deployment.yml" ]; then
            # Use sed to replace the image line while preserving indentation
            sed -i -E "s|image: .*aka717/ieee-page:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}|g" deployment.yaml
            echo "Updated deployment.yml with new image tag"
          else
            echo "Warning: deployment.yml not found in the manifest repository"
          fi
          
          # Commit and push the changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update ieee-page image to ${{ steps.sha.outputs.short }}" || echo "No changes to commit"
          git push || echo "Failed to push changes"